name: clientlaunch
services:
  db:
    image: postgres:16.10
    environment:
      POSTGRES_USER: clientlaunch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run node scripts/demo.mjs first}
      POSTGRES_DB: clientlaunch
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientlaunch -d clientlaunch"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://clientlaunch:${DB_PASSWORD}@db:5432/clientlaunch
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      PORTAL_SIGNING_KEY: ${SESSION_SECRET}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      APP_MODE: ${APP_MODE:-DEMO}
      MODEL_MODE: ${MODEL_MODE:-demo}
      CONNECTOR_MODE: ${CONNECTOR_MODE:-demo}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DEMO_REFERENCE_DATE: ${DEMO_REFERENCE_DATE:-2026-09-28}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8080}
      SMTP_FROM: ${SMTP_FROM:-}
      N8N_PROVISION_WEBHOOK_URL: http://n8n:5678/webhook/clientlaunch/provision
      N8N_SUBMISSION_WEBHOOK_URL: http://n8n:5678/webhook/clientlaunch/submission
      N8N_RECOVERY_WEBHOOK_URL: http://n8n:5678/webhook/clientlaunch/recover
      ASSET_STORAGE_DIR: /app/data/assets
    volumes:
      - assets_data:/app/data/assets
    ports:
      - "127.0.0.1:8018:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    environment:
      MODEL_MODE: ${MODEL_MODE:-demo}
      INTERNAL_KEY: ${INTERNAL_KEY}
      AI_CHECKPOINT_DSN: postgresql://clientlaunch:${DB_PASSWORD}@db:5432/clientlaunch
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8021:8001"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.40.7
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: clientlaunch
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Tehran
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_TIMEOUT: 300
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./.runtime:/bootstrap:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  n8n_data:
  assets_data:
