dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic[email]>=2.10,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
]

[tool.uv]
package = false
