name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Compile Python source
        run: python -m compileall -q apps scripts evals tests
      - name: Test AI planning
        run: python -m unittest discover -s tests/ai -v
      - name: Test business API
        run: python -m unittest discover -s tests/api -v
      - name: Smoke test migration and fast synthetic seed
        env:
          DATABASE_URL: sqlite:///./ci-clientlaunch.db
          DEMO_ADMIN_PASSWORD: CI-disposable-password
          INTERNAL_KEY: CI-disposable-internal-key
          WEBHOOK_SECRET: CI-disposable-webhook-secret
        run: |
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m scripts.seed --mode fast
      - name: Validate n8n workflow pack statically
        run: python scripts/validate_workflows.py
      - name: Validate synthetic evaluation dataset
        run: python evals/validate_dataset.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install pinned web dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm build
      - name: Test web API boundary
        run: pnpm test
